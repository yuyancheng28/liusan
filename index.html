<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六三class</title>
    <style>
        /* 全局重置与背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a2a3a 0%, #0f1b2b 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* 容器 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 1. 登录/注册界面 (默认显示) --- */
        .auth-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 20, 30, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
            padding: 20px;
        }

        /* 添加模糊背景效果 */
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: -1;
        }

        .auth-logo {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #4CAF50;
        }

        .auth-form {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #ccc;
        }

        .form-group input:focus {
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.25);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .auth-btn {
            flex: 1;
            padding: 14px;
            background-color: #FF9800;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .auth-btn:hover {
            background-color: #E68900;
        }

        .auth-btn-clear {
            flex: 1;
            padding: 14px;
            background-color: #666;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .auth-btn-clear:hover {
            background-color: #555;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
        }

        /* --- 2. 主页内容 (默认隐藏) --- */
        .main-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            opacity: 0; /* 初始透明 */
            pointer-events: none; /* 初始不可点击 */
            transition: opacity 0.5s ease-out;
        }

        /* 左侧公告栏 */
        .sidebar {
            width: 300px;
            height: 100vh;
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            padding: 30px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.3);
            z-index: 10;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            color: #FFD700;
            font-size: 1.5rem;
        }

        .sidebar p {
            line-height: 1.8;
            font-size: 14px;
            color: #ddd;
        }

        .user-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }

        .user-info p {
            margin: 8px 0;
        }

        .logout-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #FF5252;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background-color: #FF1744;
        }

        /* 右侧按钮区域 */
        .button-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            height: 100vh;
            padding: 20px;
        }

        .nav-btn {
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            padding: 18px 50px;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            width: 250px;
            border: 2px solid #388E3C;
        }

        .nav-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background-color: #388E3C;
        }

        .nav-btn:nth-child(1) { background-color: #2196F3; border-color: #1976D2; }
        .nav-btn:nth-child(2) { background-color: #9C27B0; border-color: #7B1FA2; }
        .nav-btn:nth-child(3) { background-color: #FF5722; border-color: #D84315; }
    </style>
</head>
<body>

    <div class="container">

        <!-- 登录界面 -->
        <div class="auth-container" id="loginLayer">
            <div class="auth-logo">🔓 欢迎登录</div>
            <form class="auth-form" onsubmit="login(event)">
                <div class="form-group">
                    <label for="username">学号</label>
                    <input type="text" id="username" placeholder="请输入学号..." required>
                </div>
                <div class="form-group">
                    <label for="passwd">密码（姓名简写）</label>
                    <input type="password" id="passwd" placeholder="例如：zhangsan" required>
                </div>
                <div class="error-msg" id="errorMsg"></div>
                <div class="button-group">
                    <button type="submit" class="auth-btn">登录</button>
                    <button type="reset" class="auth-btn-clear">清除</button>
                </div>
            </form>
        </div>

        <!-- 主页内容 -->
        <div class="main-container" id="mainContent">
            
            <!-- 左侧公告栏 -->
            <div class="sidebar">
                <h2>📢 公告</h2>
                <p>欢迎来到 yyc为大家制作的<strong>网页同学录</strong>！</p>
                
                <div class="user-info">
                    <p><strong>当前用户：</strong></p>
                    <p id="currentUser">-</p>
                </div>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>

            <!-- 右侧功能按钮 -->
            <div class="button-container">
                <a href="/liuyan" target="_blank" class="nav-btn">跳转毕业留言册</a>
                <a href="/xingxi" target="_blank" class="nav-btn">跳转各同学信息（暂不可用）</a>
                <a href="/about" class="nav-btn">跳转到关于页（暂不可用）</a>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // 账户数据
        const accountAll = [
            { username: 1, passwd: 'meiyingxuan' },
            { username: 2, passwd: 'jiangjiaming' },
            { username: 3, passwd: 'liangruibing' },
            { username: 4, passwd: 'huanghao' },
            { username: 5, passwd: 'zhangjiaxu' },
            { username: 6, passwd: 'huyifan' },
            { username: 7, passwd: 'zhongxianglu' },
            { username: 8, passwd: 'tangguoxin' },
            { username: 9, passwd: 'chenanqi' },
            { username: 10, passwd: 'renjiarui' },
            { username: 11, passwd: 'zhouhongyu' },
            { username: 12, passwd: 'liuwenyi' },
            { username: 13, passwd: 'xiaoqixuan' },
            { username: 14, passwd: 'shuaixingting' },
            { username: 15, passwd: 'lubiye' },
            { username: 16, passwd: 'liujiayi' },
            { username: 17, passwd: 'dongwenhao' },
            { username: 18, passwd: 'chensiyu' },
            { username: 19, passwd: 'guoruiling' },
            { username: 20, passwd: 'guosuling' },
            { username: 21, passwd: 'gongzhihui' },
            { username: 22, passwd: 'liuzhirui' },
            { username: 23, passwd: 'wuyixi' },
            { username: 24, passwd: 'wenyaoxing' },
            { username: 25, passwd: 'liziyao' },
            { username: 26, passwd: 'liuzixi' },
            { username: 27, passwd: 'yangtong' },
            { username: 28, passwd: 'lidan' },
            { username: 29, passwd: 'liyang' },
            { username: 30, passwd: 'qingzichen' },
            { username: 31, passwd: 'furuiqi' },
            { username: 32, passwd: 'daiyaxing' },
            { username: 33, passwd: 'gonglinghui' },
            { username: 34, passwd: 'zhongshiqi' },
            { username: 35, passwd: 'tangtianchi' },
            { username: 36, passwd: 'caoyunting' },
            { username: 37, passwd: 'xujingyu' },
            { username: 38, passwd: 'sunlongjingyuan' },
            { username: 39, passwd: 'zhangrongjun' },
            { username: 40, passwd: 'jinshengding' },
            { username: 41, passwd: 'zhangyuqian' },
            { username: 42, passwd: 'zhouyanzi' },
            { username: 43, passwd: 'huzicheng' },
            { username: 44, passwd: 'yuyancheng' },
            { username: 45, passwd: 'dengjingran' },
            { username: 46, passwd: 'pengmingyang' },
            { username: 47, passwd: 'xiangyuhang' },
            { username: 48, passwd: 'qianyaxuan' },
            { username: 49, passwd: 'liangjunshuo' },
        ];

        let currentUsername = null;

        function login(event) {
            event.preventDefault(); // 阻止表单默认提交
            
            const username = document.getElementById('username').value.trim();
            const passwd = document.getElementById('passwd').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            // 清除之前的错误信息
            errorMsg.textContent = '';

            // 查找用户
            const account = accountAll.find(e => String(e.username) === username);

            if (!account) {
                errorMsg.textContent = '❌ 账户不存在';
                return;
            }

            if (account.passwd !== passwd) {
                errorMsg.textContent = '❌ 密码错误';
                return;
            }

            // 登录成功
            currentUsername = username;
            document.getElementById('currentUser').textContent = `学号：${username}`;
            
            const loginLayer = document.getElementById('loginLayer');
            const mainContent = document.getElementById('mainContent');

            // 动画效果
            loginLayer.style.transform = 'translateY(-100%)';
            loginLayer.style.opacity = '0';
            loginLayer.style.pointerEvents = 'none';

            setTimeout(() => {
                mainContent.style.opacity = '1';
                mainContent.style.pointerEvents = 'auto';
            }, 500);
        }

        function logout() {
            const loginLayer = document.getElementById('loginLayer');
            const mainContent = document.getElementById('mainContent');
            
            // 重置表单
            document.querySelector('.auth-form').reset();
            document.getElementById('errorMsg').textContent = '';
            currentUsername = null;

            // 动画效果
            mainContent.style.opacity = '0';
            mainContent.style.pointerEvents = 'none';

            setTimeout(() => {
                loginLayer.style.transform = 'translateY(0)';
                loginLayer.style.opacity = '1';
                loginLayer.style.pointerEvents = 'auto';
            }, 500);
        }
    </script>

</body>
</html>
