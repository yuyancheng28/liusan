<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毕业留言册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft Yahei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            color: white; 
            font-size: 2.5rem; 
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .board { 
            display: grid; 
            grid-template-columns: 1fr 350px; 
            gap: 30px; 
        }
        .messages { 
            background: white; 
            border-radius: 15px; 
            padding: 30px;
            min-height: 500px;
        }
        .msg-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-author { 
            font-weight: bold; 
            color: #667eea; 
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .msg-content { 
            color: #333; 
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .msg-time { 
            color: #999; 
            font-size: 0.85rem;
            text-align: right;
        }
        .nav { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
        }
        .nav-btn:hover { background: #5a67d8; }
        .nav-btn:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
        }
        .form-panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            height: fit-content;
        }
        .form-panel h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .submit-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover { background: #5a67d8; }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.1rem;
        }
        .loading {
            text-align: center;
            color: #667eea;
            padding: 40px;
        }
        @media (max-width: 768px) {
            .board { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 毕业留言册</h1>
        
        <div class="board">
            <div class="messages">
                <div id="msgList"></div>
                <div class="nav">
                    <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">← 上一页</button>
                    <button class="nav-btn" id="nextBtn" onclick="changePage(1)">下一页 →</button>
                </div>
            </div>
            
            <div class="form-panel">
                <h2>✍️ 写留言</h2>
                <div class="form-group">
                    <label>你的名字</label>
                    <input type="text" id="authorInput" placeholder="输入你的名字">
                </div>
                <div class="form-group">
                    <label>留言内容</label>
                    <textarea id="contentInput" placeholder="写下你想说的话..."></textarea>
                </div>
                <button class="submit-btn" id="submitBtn" onclick="saveMessage()">提交留言</button>
            </div>
        </div>
    </div>

    <script>
        // ========== & 配置区域 ==========
        const USERNAME = 'yuyancheng28';
        const REPO = 'liusan';
        const TOKEN = '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';  // ← 第148行，填你的Token
        // ====================================

        let currentPage = 1;
        let allMessages = [];
        const PER_PAGE = 10;

        const msgList = document.getElementById('msgList');
        const authorInput = document.getElementById('authorInput');
        const contentInput = document.getElementById('contentInput');
        const submitBtn = document.getElementById('submitBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // 加载留言
        async function loadMessages() {
            msgList.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${USERNAME}/${REPO}/issues?state=all&per_page=100`,
                    {
                        headers: {
                            'Authorization': `token ${TOKEN}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );

                if (response.status === 401) {
                    msgList.innerHTML = '<div class="empty">❌ Token 无效，请检查第148行</div>';
                    return;
                }

                const data = await response.json();
                allMessages = data
                    .filter(issue => issue.pull_request === null)
                    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                displayMessages();
            } catch (error) {
                msgList.innerHTML = `<div class="empty">❌ 网络错误: ${error.message}</div>`;
            }
        }

        // 显示留言
        function displayMessages() {
            const start = (currentPage - 1) * PER_PAGE;
            const end = start + PER_PAGE;
            const pageMessages = allMessages.slice(start, end);

            if (pageMessages.length === 0) {
                msgList.innerHTML = '<div class="empty">还没有留言，快来写第一条吧！🎉</div>';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            msgList.innerHTML = pageMessages.map(msg => `
                <div class="msg-card">
                    <div class="msg-author">👤 ${escapeHtml(msg.title)}</div>
                    <div class="msg-content">${escapeHtml(msg.body || '(无内容)')}</div>
                    <div class="msg-time">${formatDate(msg.created_at)}</div>
                </div>
            `).join('');

            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = end >= allMessages.length;
        }

        // 翻页
        function changePage(delta) {
            currentPage += delta;
            displayMessages();
        }

        // 保存留言
        async function saveMessage() {
            const author = authorInput.value.trim();
            const content = contentInput.value.trim();

            if (!author || !content) {
                alert('请填写名字和留言内容！');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';

            try {
                const response = await fetch(
                    `https://api.github.com/repos/${USERNAME}/${REPO}/issues`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${TOKEN}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            title: author,
                            body: content
                        })
                    }
                );

                if (response.status === 401) {
                    alert('❌ Token 无效，请检查配置！');
                    return;
                }

                if (response.ok) {
                    authorInput.value = '';
                    contentInput.value = '';
                    alert('✅ 留言成功！');
                    loadMessages();
                } else {
                    alert('❌ 提交失败，请重试');
                }
            } catch (error) {
                alert('❌ 网络错误: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '提交留言';
            }
        }

        // 工具函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 回车提交
        contentInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                saveMessage();
            }
        });

        // 初始化
        loadMessages();
    </script>
</body>
</html>
